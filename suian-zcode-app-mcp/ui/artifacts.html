<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话工件</title>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#25272c;--muted:#85878d;--line:#ececef;--hover:#f5f5f7;--accent:#9b5cff;--file:#5282c9;--link:#459576;--issue:#b3872e;--error:#ac5b25;--closed:#b8433b;--conflict:#9c6b00;--clock:#8f7a1d}
:root[data-theme=dark]{color-scheme:dark;--bg:#202124;--ink:#e5e5e9;--muted:#a0a1aa;--line:#38393f;--hover:#2d2e34;--accent:#bc8aff;--file:#8caff0;--link:#85bea4;--issue:#d6ad63;--error:#edb586;--closed:#e07b72;--conflict:#d9a44a;--clock:#cbb14e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{padding:18px 20px;max-width:880px;margin:auto}button,a,summary{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--file);outline-offset:3px;border-radius:5px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}h1{margin:0;font-size:18px;font-weight:600}.refresh{padding:5px 8px;border-radius:6px;color:var(--muted)}.refresh:hover,.back:hover{background:var(--hover);color:var(--ink)}.context{font-size:12px;color:var(--muted);margin:4px 0 18px}details{border-top:1px solid var(--line);padding:12px 0 10px}details:last-child{border-bottom:1px solid var(--line)}summary{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;color:var(--muted);padding:2px 0 7px;user-select:none}summary::-webkit-details-marker{display:none}.chevron{width:14px;height:14px;transition:transform .15s;flex:none}details[open] .chevron{transform:rotate(90deg)}.count{margin-left:auto;min-width:22px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}.entries{list-style:none;padding:0;margin:0}.entry{width:100%;display:flex;align-items:center;gap:11px;padding:9px 4px;text-align:left;border-radius:6px;min-width:0}.entry:hover{background:var(--hover)}.entry-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.icon{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;fill:none}.icon.pr{color:var(--accent)}.icon.file{color:var(--file)}.icon.link{color:var(--link)}.icon.issue{color:var(--issue)}.icon.missing{opacity:.4}.icon.pr[data-state=open]{color:var(--link)}.icon.pr[data-state=draft]{color:var(--muted)}.icon.pr[data-state=conflict]{color:var(--conflict)}.icon.pr[data-state=merged]{color:var(--accent)}.icon.pr[data-state=closed]{color:var(--closed)}.icon.pr path.dash{stroke-dasharray:3 3}.icon.clock{width:14px;height:14px;color:var(--clock)}.diff{display:inline-flex;align-items:center;gap:7px;flex:none;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}.diff .additions{color:var(--link)}.diff .deletions{color:var(--closed)}.direction{font-size:11px;color:var(--muted);flex:none}.group-empty{font-size:12px;color:var(--muted);padding:7px 25px}#empty{padding:14px 0;color:var(--muted);font-size:13px}#diagnostic{padding:10px 12px;margin:12px 0;background:var(--hover);border-left:2px solid var(--error);font-size:12px;color:var(--error)}#status,#detail-status{font-size:11px;color:var(--muted);margin:16px 0 0}.error{color:var(--error)!important}.back{display:flex;align-items:center;gap:5px;padding:5px 0;border-radius:5px;color:var(--muted);font-size:13px}.detail-header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}.detail-title{display:flex;align-items:flex-start;gap:10px;margin:0 0 18px}.detail-title .icon{margin-top:5px}.detail-title h2{font-size:18px;line-height:1.5;margin:0;font-weight:600;overflow-wrap:anywhere;min-width:0}dl{margin:0}dl>div{padding:10px 0;border-bottom:1px solid var(--line)}dt{font-size:12px;color:var(--muted);margin-bottom:3px}dd{margin:0;overflow-wrap:anywhere}a{color:var(--file);text-decoration:none}a:hover{text-decoration:underline}.ref{font:12px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;user-select:text}.reveal{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--line);border-radius:6px;font-size:13px}.reveal:hover:not(:disabled){background:var(--hover);border-color:var(--file)}.reveal:disabled{cursor:not-allowed;opacity:.45}.session-details{padding-top:20px}.session-details h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 8px}.state{display:inline-flex;align-items:center;gap:7px;font-size:14px}.state::before{content:"";width:7px;height:7px;background:var(--link);border-radius:50%}.state[data-state=running]::before{background:var(--file)}.state[data-state=error]::before{background:var(--error)}.session-error{overflow-wrap:anywhere;font-size:13px;color:var(--error)}[hidden]{display:none!important}@media(max-width:340px){main{padding:14px}.direction{font-size:10px}}
</style>
</head>
<body>
<main>
  <section id="list-view">
    <header><h1>会话工件</h1><button id="refresh" class="refresh" aria-label="刷新列表" type="button">刷新</button></header>
    <p id="revision" class="context">正在读取当前会话…</p>
    <div id="diagnostic" role="status" hidden></div>
    <div id="groups"></div>
    <p id="empty" hidden>当前会话尚无工件</p>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section id="detail-view" hidden>
    <header class="detail-header"><button id="back" class="back" aria-label="返回列表" type="button">‹ 返回</button><button id="detail-refresh" class="refresh" aria-label="刷新详情" type="button">刷新</button></header>
    <div id="detail-content"></div>
    <p id="detail-status" role="status" aria-live="polite"></p>
  </section>
</main>
<script type="module">
const host = window.zcode;
const listView = document.getElementById('list-view'), detailView = document.getElementById('detail-view');
const refreshButton = document.getElementById('refresh'), detailRefresh = document.getElementById('detail-refresh');
const revision = document.getElementById('revision'), groups = document.getElementById('groups');
const diagnostic = document.getElementById('diagnostic'), empty = document.getElementById('empty'), status = document.getElementById('status');
const detailContent = document.getElementById('detail-content'), detailStatus = document.getElementById('detail-status');
const names = { pr: '拉取请求', issue: '议题', session: '会话', file: '文件', link: '链接' };
const directions = { outgoing: '已发起', incoming: '发起者', related: '关联会话' };
const paths = {
  pr: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10M18 17V9a4 4 0 0 0-4-4h-2m2-2-2 2 2 2"/>',
  issue: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1.4"/>',
  session: '<path d="M21 11a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 1 1 18-5Z"/>',
  outgoing: '<path d="M14 3h7v7M21 3 10 14M8 5H4v15h15v-4"/>',
  incoming: '<path d="M10 14H3V7M3 14 14 3M16 5h4v15H5v-3"/>',
  file: '<path d="M14 2H5v20h14V7l-5-5Zm0 0v5h5M8 12h8M8 16h6"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  link: '<path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 8l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/>'
};
// PR 实时状态图形（服务端已归并五种）：沿用现有 stroke 线条风，草稿用虚线区分
const prStates = {
  open: { name: '开放', path: paths.pr },
  draft: { name: '草稿', path: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path class="dash" d="M6 7v10M18 17v-7a4 4 0 0 0-4-4h-2"/>' },
  conflict: { name: '冲突', path: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10M18 17v-2"/><path d="M18 6v5"/><path d="M18 13.5v.01"/>' },
  merged: { name: '已合并', path: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10M18 17v-7a4 4 0 0 0-4-4h-1"/><path d="M13 3l-3 3 3 3"/>' },
  closed: { name: '已关闭', path: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10M18 17v-3"/><path d="m12.5 6.5 5 5m0-5-5 5"/>' }
};
const clockPath = '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>';
let selectedRef, detailRequest = 0, currentDetail = null;
// 面板 PR 状态通道（get_pr_statuses）最近一次结果：ref -> {status,additions,deletions,fetched_at[,stale]} 或 {error}
let prStatuses = {};
const display = item => item.session_title ?? item.label;
function element(tag, className, text) {
  const node = document.createElement(tag); node.className = className; node.textContent = text; return node;
}
function icon(kind, direction, item) {
  const key = kind === 'session' && ['outgoing', 'incoming'].includes(direction) ? direction
    : kind === 'file' && item?.is_directory ? 'folder' : kind;
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  node.setAttribute('viewBox', '0 0 24 24');
  node.setAttribute('class', 'icon ' + kind + (item?.missing ? ' missing' : ''));
  node.setAttribute('aria-hidden', 'true'); node.dataset.icon = key; node.innerHTML = paths[key]; return node;
}
function prStateIcon(status) {
  const state = prStates[status.status] ?? { name: status.status, path: paths.pr };
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  node.setAttribute('viewBox', '0 0 24 24'); node.setAttribute('class', 'icon pr');
  node.setAttribute('aria-hidden', 'true'); node.dataset.icon = 'pr-' + status.status;
  if (prStates[status.status]) node.dataset.state = status.status;
  node.innerHTML = '<title>PR 状态：' + state.name + '</title>' + state.path; return node;
}
function clockIcon(status) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  node.setAttribute('viewBox', '0 0 24 24'); node.setAttribute('class', 'icon clock');
  node.setAttribute('aria-hidden', 'true'); node.dataset.icon = 'pr-stale';
  node.innerHTML = '<title>状态数据停留于 ' + time(status.fetched_at) + '，本次拉取超时未刷新</title>' + clockPath; return node;
}
// 状态装饰幂等：先清旧装饰再按最新结果重画；出错或无数据回默认 pr 图标，不显示数字与钟表
function decoratePrRow(button) {
  button.querySelector(':scope > .diff')?.remove();
  button.querySelector(':scope > .icon.clock')?.remove();
  const status = prStatuses[button.dataset.ref], usable = status && !status.error;
  const current = button.querySelector(':scope > .icon');
  if (current && !usable && current.dataset.state) current.replaceWith(icon('pr'));
  else if (current && usable && current.dataset.state !== status.status) current.replaceWith(prStateIcon(status));
  if (!usable) return;
  const diff = element('span', 'diff', '');
  diff.append(element('span', 'additions', '+' + status.additions), element('span', 'deletions', '-' + status.deletions));
  button.append(diff);
  if (status.stale) button.append(clockIcon(status));
}
function applyStatuses() {
  for (const button of groups.querySelectorAll('.entry[data-kind="pr"]')) decoratePrRow(button);
  if (currentDetail?.item?.kind === 'pr' && currentDetail.item.ref === selectedRef && !detailView.hidden)
    renderDetail(currentDetail); // 重绘幂等，状态迟到时补上或更新详情字段
}
// 面板专用状态通道：仅挂在标准刷新时机（列表刷新/订阅信号/详情打开与刷新）触发；
// 进行中合并为一批，通道失败静默保持现状，不弹错误打断面板
let statusBusy = false, statusQueue = new Set();
function syncStatuses(refs) {
  for (const ref of refs) statusQueue.add(ref);
  if (statusBusy) return;
  statusBusy = true;
  void (async () => {
    try {
      while (statusQueue.size) {
        const batch = [...statusQueue];
        statusQueue = new Set();
        try {
          const result = await host.callTool('get_pr_statuses', { refs: batch });
          if (!result.isError && result.structuredContent) {
            Object.assign(prStatuses, result.structuredContent.statuses ?? {});
            applyStatuses();
          }
        } catch { /* 状态通道不可用：静默保持现状 */ }
      }
    } finally { statusBusy = false; }
  })();
}
function theme() { document.documentElement.dataset.theme = host.theme ?? 'light'; }
function time(value) { return value == null ? '未记录' : new Date(value).toLocaleString('zh-CN', { hour12: false }); }
async function get(args) {
  const result = await host.callTool('get_artifacts', args);
  if (result.isError) throw new Error(result.structuredContent?.error ?? result.content?.[0]?.text ?? '工件读取失败');
  if (!result.structuredContent) throw new Error('工件响应缺少完整数据，请重新加载');
  return result.structuredContent;
}
function render(state) {
  const openKinds = new Set(groups.children.length
    ? [...groups.children].filter(group => group.open).map(group => group.dataset.kind) : Object.keys(names));
  revision.textContent = '当前会话 · 共 ' + state.stats.total + ' 条';
  diagnostic.hidden = state.inheritance?.status !== 'snapshot_missing';
  diagnostic.textContent = '所选历史断点没有工件快照，未继承父工件。当前会话仍可独立管理工件。';
  empty.hidden = state.items.length !== 0;
  groups.replaceChildren(...Object.entries(names).map(([kind, name]) => {
    const group = document.createElement('details'); group.dataset.kind = kind; group.open = openKinds.has(kind);
    const summary = document.createElement('summary'), chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    chevron.setAttribute('class', 'chevron'); chevron.setAttribute('viewBox', '0 0 16 16'); chevron.setAttribute('aria-hidden', 'true');
    chevron.innerHTML = '<path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/>';
    summary.append(chevron, element('span', '', name), element('span', 'count', state.stats.by_kind[kind]));
    const entries = element('ul', 'entries', '');
    const items = state.items.filter(item => item.kind === kind);
    entries.append(...items.map(item => {
      const row = document.createElement('li'), button = element('button', 'entry', '');
      button.type = 'button'; button.dataset.kind = kind; button.dataset.ref = item.ref;
      button.setAttribute('aria-label', '查看详情：' + display(item)); button.title = display(item);
      button.append(icon(kind, item.session_direction, item), element('span', 'entry-label', display(item)));
      if (kind === 'session' && item.session_direction && item.session_direction !== 'related')
        button.append(element('span', 'direction', directions[item.session_direction]));
      button.addEventListener('click', () => showDetail(item.ref)); row.append(button); return row;
    }));
    if (!items.length) entries.append(element('li', 'group-empty', '暂无' + name));
    group.append(summary, entries); return group;
  }));
  for (const button of groups.querySelectorAll('.entry[data-kind="pr"]')) decoratePrRow(button);
}
function field(list, name, value, className = '') {
  const row = document.createElement('div'), content = element('dd', className, '');
  if (value instanceof Node) content.append(value); else content.textContent = value;
  row.append(element('dt', '', name), content); list.append(row);
}
function renderDetail(detail) {
  const item = detail.item, title = element('div', 'detail-title', '');
  const prStatus = item.kind === 'pr' ? prStatuses[item.ref] : undefined;
  const usable = prStatus && !prStatus.error;
  title.append(item.kind === 'pr' && usable ? prStateIcon(prStatus) : icon(item.kind, item.session_direction, item),
    element('h2', '', display(item)));
  const list = document.createElement('dl');
  field(list, '类型', names[item.kind] + (item.session_direction ? ' · ' + directions[item.session_direction] : ''));
  field(list, '用途', item.purpose);
  let ref = item.ref;
  if (detail.hyperlink && host.hostCapabilities?.openLinks) {
    ref = element('a', '', detail.hyperlink); ref.href = detail.hyperlink;
    ref.addEventListener('click', async event => {
      event.preventDefault();
      try { await host.openExternal({ href: detail.hyperlink }); }
      catch (error) { detailStatus.className = 'error'; detailStatus.textContent = '链接打开失败：' + error.message; }
    });
  }
  field(list, detail.hyperlink ? '超链接' : '引用', ref, 'ref');
  field(list, '创建时间', time(item.created_at)); field(list, '更新时间', time(item.updated_at));
  // 本机定位通道（reveal_artifact）：宿主 openLink 只放行 http(s)，file:// 被拒，经 callTool 由 server 起系统命令；
  // 缺失态（AP-04 探测）灰化不可点击，打开失败行内回报不静默
  if (item.kind === 'file') {
    const button = element('button', 'reveal', '用文件资源管理器打开');
    button.type = 'button';
    if (item.missing) { button.disabled = true; button.title = '路径缺失，无法在资源管理器中打开'; }
    else button.addEventListener('click', () => void revealArtifact(item.ref, button));
    field(list, '操作', button);
  }
  if (item.kind === 'pr') {
    const status = prStatuses[item.ref];
    if (status && !status.error) {
      const state = prStates[status.status] ?? { name: status.status };
      field(list, 'PR 状态', state.name + (status.stale ? '（数据停留于 ' + time(status.fetched_at) + '，拉取超时未刷新）' : ''));
      const diff = element('span', 'diff', '');
      diff.append(element('span', 'additions', '+' + status.additions), element('span', 'deletions', '-' + status.deletions));
      field(list, '代码变更', diff);
    }
  }
  detailContent.replaceChildren(title, list);
  if (detail.session) {
    const session = detail.session, section = element('section', 'session-details', '');
    section.append(element('h3', '', '会话实时状态'));
    if (session.error) section.append(element('p', 'session-error', '查询失败：' + session.error));
    else {
      const state = element('span', 'state', session.pending_interaction ? '等待处理' : { running: '正在运行', completed: '已完成', error: '发生错误' }[session.status]);
      state.dataset.state = session.status; section.append(state);
      const sessionFields = document.createElement('dl');
      field(sessionFields, '会话名称', session.title); field(sessionFields, '工作区', session.workspace_path, 'ref');
      field(sessionFields, '会话创建时间', time(session.created_at)); field(sessionFields, '会话更新时间', time(session.updated_at));
      section.append(sessionFields);
    }
    const query = document.createElement('dl'); field(query, '查询时间', time(session.queried_at)); section.append(query);
    detailContent.append(section);
  }
}
// 详情页"用文件资源管理器打开"：经 reveal_artifact 由 server 起系统命令定位本机文件；
// 失败（非零退出、无法启动、超时）行内回报错误，不静默
async function revealArtifact(ref, button) {
  button.disabled = true;
  detailStatus.className = ''; detailStatus.textContent = '正在打开…';
  try {
    const result = await host.callTool('reveal_artifact', { ref });
    if (result.isError) throw new Error(result.structuredContent?.error ?? result.content?.[0]?.text ?? '打开失败');
    detailStatus.textContent = '已在文件资源管理器中打开';
  } catch (error) {
    detailStatus.className = 'error'; detailStatus.textContent = '打开失败：' + error.message;
  } finally { button.disabled = false; }
}
async function showDetail(ref) {
  selectedRef = ref; const request = ++detailRequest;
  listView.hidden = true; detailView.hidden = false; detailRefresh.disabled = true;
  detailContent.replaceChildren(); currentDetail = null; detailStatus.className = ''; detailStatus.textContent = '正在读取详情…';
  try {
    const detail = await get({ ref });
    if (request !== detailRequest) return;
    currentDetail = detail;
    renderDetail(detail); detailStatus.textContent = '已读取当前详情';
    if (detail.item.kind === 'pr') syncStatuses([detail.item.ref]);
  } catch (error) {
    if (request !== detailRequest) return;
    detailStatus.className = 'error'; detailStatus.textContent = error.message;
  } finally { if (request === detailRequest) detailRefresh.disabled = false; }
}
// 工件面板的实时刷新信号：桥支持资源订阅时挂载（ZCode 3.15+ 的 experimental zcode/resourceSubscribe），
// 通知只当"有变化"信号，数据仍经 get_artifacts 工具按当前会话拉取；无桥或订阅失败静默保持手动刷新。
const RESOURCE_URI = 'suian-artifacts://current';
// 信号路径的详情重拉与列表 refresh 对称合并：进行中收到新信号合并为完成后补拉一次，
// 避免连续的工件写入突发信号放大对原 Host 的会话状态实时查询；用户点击仍直接刷新
let detailLiveBusy = false, detailLivePending = false;
function refreshDetailLive() {
  if (selectedRef === undefined || detailView.hidden) return;
  if (detailLiveBusy) { detailLivePending = true; return; }
  detailLiveBusy = true;
  const done = () => {
    detailLiveBusy = false;
    if (detailLivePending) { detailLivePending = false; refreshDetailLive(); }
  };
  void showDetail(selectedRef).then(done, done);
}
// 返回订阅是否成功；初始化时先订阅再首刷，把首刷后丢信号的窗口压到订阅在途的毫秒级（MCP 订阅无补发语义）
async function subscribeLive() {
  if (typeof host.subscribeResource !== 'function' || typeof host.onResourceUpdated !== 'function') return false;
  try {
    host.onResourceUpdated(uri => {
      if (uri !== RESOURCE_URI) return;
      void refresh();
      refreshDetailLive();
    });
    await host.subscribeResource(RESOURCE_URI);
    return true;
  } catch { return false; }
}
let refreshing = false, refreshPending = false;
async function refresh() {
  if (refreshing) { refreshPending = true; return; }
  refreshing = true;
  refreshButton.disabled = true; status.className = ''; status.textContent = '正在刷新…';
  try {
    const state = await get({ offset: 0, limit: 50 });
    let next = state.next_offset;
    while (next !== null) {
      const page = await get({ offset: next, limit: 50 });
      if (page.revision !== state.revision) throw new Error('读取期间工件发生变化，请重新刷新');
      state.items.push(...page.items); next = page.next_offset;
    }
    render(state); status.textContent = '已更新 · 点击条目查看详情';
    syncStatuses(state.items.filter(item => item.kind === 'pr').map(item => item.ref));
  } catch (error) {
    groups.replaceChildren(); revision.textContent = '读取失败'; empty.hidden = true; diagnostic.hidden = true;
    status.className = 'error'; status.textContent = error.message;
  } finally {
    refreshing = false; refreshButton.disabled = false;
    if (refreshPending) { refreshPending = false; void refresh(); }
  }
}
document.getElementById('back').addEventListener('click', () => {
  detailRequest++; selectedRef = undefined; currentDetail = null; detailView.hidden = true; listView.hidden = false;
});
refreshButton.addEventListener('click', refresh);
detailRefresh.addEventListener('click', () => showDetail(selectedRef));
try { host.subscribe(theme); await host.ready(); theme(); await subscribeLive(); await refresh(); }
catch (error) { status.className = 'error'; status.textContent = error.message; refreshButton.disabled = true; }
</script>
</body>
</html>
