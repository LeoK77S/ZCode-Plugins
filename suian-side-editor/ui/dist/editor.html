<style>:root{color-scheme:light;--bg:#fff;--surface:#f4f4f4;--ink:#252525;--muted:#777;--line:#e2e2e2;--accent:#009de2;--error:#b94128;--selection:#dceef8}
:root[data-theme=dark]{color-scheme:dark;--bg:#191919;--surface:#272727;--ink:#ededed;--muted:#969696;--line:#303030;--accent:#00a9ed;--error:#f29b86;--selection:#243746}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;border:1px solid transparent;background:none;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:hover:not(:disabled){background:var(--surface)}
header{flex:none}#tabs{display:flex;gap:6px;min-height:47px;padding:4px 8px;border-bottom:1px solid var(--line);overflow-x:auto}.tab{display:flex;align-items:center;gap:2px;min-width:140px;max-width:260px;padding:2px 5px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.tab.active{border-color:#656565}.tab-button{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:4px 5px}.tab-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tab.temporary .tab-title{font-style:italic}.file-icon{color:var(--muted);font-size:18px}.tab-close{border-radius:5px;flex:none;color:var(--muted);padding:1px 5px;font-size:18px}
.toolbar{display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 12px}.actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}.save-mode{font-size:12px;color:var(--muted)}#breadcrumb{display:flex;gap:10px;align-items:center;min-width:0;padding:6px 13px;background:var(--surface);border-radius:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.crumb-separator{color:var(--muted)}.icon-button{display:flex;justify-content:center;align-items:center;width:40px;height:40px;padding:9px;border:1px solid var(--line);border-radius:50%;background:var(--surface)}.icon-button[aria-expanded=true]{color:#72b9ff;background:#202832}.icon-button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.workspace{display:flex;flex:1;min-height:0}main{flex:1;min-width:0;display:flex;justify-content:center;overflow:hidden}#editor-frame{width:100%;max-width:1100px;min-width:0;height:100%;padding:2px 12px}#editor{height:100%}#empty{height:100%;display:grid;place-items:center;color:var(--muted)}#editor .cm-editor{height:100%;background:var(--bg);color:var(--ink)}#editor .cm-scroller{overflow:auto;font:14px/1.8 ui-monospace,Consolas,"Cascadia Code",monospace}#editor .cm-gutters{border:none;background:var(--bg);color:var(--muted)}#editor .cm-lineNumbers .cm-gutterElement{padding:0 17px 0 6px}#editor .cm-activeLineGutter,#editor .cm-activeLine{background:transparent}#editor .cm-cursor{border-left-color:var(--ink)}#editor .cm-focused{outline:none}#editor .cm-selectionBackground,#editor .cm-focused .cm-selectionBackground{background:var(--selection)}
aside{width:30%;min-width:220px;max-width:380px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);padding:7px 7px 0}#workspace-title{border:1px solid var(--line);border-radius:13px;padding:8px 12px;margin:0 4px 10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tree{overflow:auto;flex:1;min-height:0;padding:2px 0 12px}.tree-row{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:3px 9px;border-radius:8px;text-align:left;white-space:nowrap}.tree-row.selected{border-color:var(--accent);background:var(--surface)}.tree-name{overflow:hidden;text-overflow:ellipsis}.tree-arrow{width:14px;flex:none;color:var(--muted);font-size:18px}.tree-row[aria-expanded=true]>.tree-arrow{transform:rotate(90deg)}.tree-file{color:#d29e33;font-size:14px;width:14px;flex:none}.tree-group{margin-left:14px;border-left:1px solid var(--line);padding-left:3px}.tree-error{font-size:12px;color:var(--error);padding:6px 10px;overflow-wrap:anywhere}
footer{display:flex;gap:12px;flex:none;min-height:27px;border-top:1px solid var(--line);padding:3px 12px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer.error{color:var(--error)}#file-info{margin-left:auto}.save-button{border:1px solid var(--line);border-radius:20px;padding:7px 13px;background:var(--surface)}.dirty-indicator{font-size:11px;color:var(--accent);margin-left:auto}
@media(max-width:600px){.toolbar{gap:5px;padding:7px}.save-mode{display:none}#breadcrumb{font-size:12px;padding:6px 9px}.actions{gap:4px}aside{width:45%;min-width:170px}.tree-row{font-size:12px;height:32px}#editor-frame{padding:2px 4px}#editor .cm-scroller{font-size:12px}#editor .cm-lineNumbers .cm-gutterElement{padding-right:8px}}
svg.file-icon,svg.tree-file{width:17px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;flex:none}#breadcrumb .current-file{font-weight:600}#breadcrumb .crumb{overflow:hidden;text-overflow:ellipsis}
.save-mode{display:block!important;border:1px solid var(--line);border-radius:20px;padding:7px 9px;white-space:nowrap}#conflict-bar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;border-top:1px solid var(--line);padding:6px 12px;color:var(--error);font-size:12px}#conflict-bar span{margin-right:auto}#conflict-bar button{border:1px solid var(--line);border-radius:8px;padding:3px 8px}
#settings-error{padding:6px 12px;color:var(--error);font-size:12px;overflow-wrap:anywhere}
dialog{max-width:calc(100% - 24px);width:420px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px}dialog::backdrop{background:#0006}dialog h2{font-size:16px;margin:0 0 12px}dialog p{overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:20px}.dialog-actions button{border:1px solid var(--line);border-radius:8px;padding:6px 10px}.dialog-error{font-size:12px;color:var(--error)}
#comment-status{padding:3px 12px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}#comment-body{display:block;width:100%;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}#comment-selection-text{max-height:160px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:8px;font-size:12px}
</style>
</head>
<body>
<header>
  <nav id="tabs" role="tablist" aria-label="打开的文件"></nav>
  <div class="toolbar">
    <div id="breadcrumb" aria-label="文件路径">文本编辑器</div>
    <div class="actions">
      <button id="comment-selection" class="save-button" disabled title="先选择文件正文">评论选区</button>
      <button id="save-mode" class="save-mode" aria-label="保存方式" disabled title="切换手动或自动保存">正在读取方式…</button>
      <button id="save" class="save-button" disabled title="保存（Ctrl+S）">保存</button>
      <button id="folder" class="icon-button" aria-label="文件列表" aria-expanded="false" disabled title="文件列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 10h18"/></svg>
      </button>
    </div>
  </div>
  <div id="conflict-bar" hidden role="alert"><span>当前编辑已保留，自动保存已暂停</span><button id="keep-edit">保留编辑</button><button id="reload-file">重新读取</button></div>
  <div id="settings-error" hidden role="alert"></div>
  <div id="comment-status" role="status" aria-live="polite">待发送评论 0 条</div>
</header>
<div class="workspace">
  <main id="main"><div id="editor-frame"><div id="empty">从文件列表选择文本</div><div id="editor" hidden></div></div></main>
  <aside id="files" aria-label="工作区文件" hidden>
    <div id="workspace-title"></div>
    <div id="tree" role="tree" aria-label="文件目录"></div>
  </aside>
</div>
<footer id="status" role="status" aria-live="polite"><span id="status-text">正在确认宿主归属…</span><span id="recovery-status">正在读取恢复副本…</span><button id="recovery-retry" hidden>重试恢复副本</button><span id="file-info"></span></footer>
<template id="file-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/></svg></template>
<dialog id="close-dialog" aria-label="未保存更改">
  <h2>未保存更改</h2>
  <p id="close-message"></p>
  <p id="close-error" class="dialog-error" role="alert"></p>
  <div class="dialog-actions"><button id="close-cancel">取消</button><button id="close-discard">放弃修改</button><button id="close-save">保存并关闭</button></div>
</dialog>
<dialog id="reload-dialog" aria-label="重新读取文件">
  <h2>重新读取文件</h2><p id="reload-message"></p>
  <div class="dialog-actions"><button id="reload-cancel">取消重新读取</button><button id="reload-confirm">放弃编辑并重新读取</button></div>
</dialog>
<dialog id="comment-dialog" aria-label="选区评论">
  <h2>选区评论</h2><p id="comment-location"></p><pre id="comment-selection-text"></pre>
  <label for="comment-body">评论内容</label><textarea id="comment-body" rows="4"></textarea>
  <p id="comment-error" class="dialog-error" role="alert"></p>
