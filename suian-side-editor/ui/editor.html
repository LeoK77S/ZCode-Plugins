<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本编辑器</title>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#25272c;--muted:#787c86;--line:#e8e9ed;--surface:#f6f7f9;--error:#aa442e;--accent:#447dc3}
:root[data-theme=dark]{color-scheme:dark;--bg:#202124;--ink:#e5e5e9;--muted:#a0a1aa;--line:#38393f;--surface:#2d2e34;--error:#f0a084;--accent:#8caff0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:12px 16px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:15px;font-weight:600}.note,#context,#status{color:var(--muted);font-size:12px;margin:7px 0;overflow-wrap:anywhere}form{display:flex;gap:8px;margin-top:10px}input,button{font:inherit;border:1px solid var(--line);border-radius:5px;color:inherit;background:var(--surface);padding:6px 8px}input{flex:1;min-width:0}button{cursor:pointer;flex:none}button:disabled{opacity:.5;cursor:default}input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}main{max-width:900px;margin:auto;padding:14px 18px}#source{margin:0 0 12px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;font:13px/1.65 ui-monospace,Consolas,monospace;margin:0;user-select:text}.error{color:var(--error)!important}[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>文本编辑器 · 只读预览</h1>
  <p class="note">开发切片：输入工作区内已有文件的相对路径</p>
  <p id="context">正在确认宿主归属…</p>
  <form id="open-form"><input id="path" aria-label="工作区相对文件路径" placeholder="例如 docs/readme.md" required disabled><button id="read" type="submit" disabled>读取</button></form>
  <p id="status" role="status" aria-live="polite"></p>
</header>
<main><p id="source" hidden></p><pre id="text" aria-label="只读文件正文"></pre></main>
<script type="module">
const host = window.zcode;
const context = document.getElementById('context'), status = document.getElementById('status');
const path = document.getElementById('path'), read = document.getElementById('read');
const source = document.getElementById('source'), text = document.getElementById('text');
function theme() { document.documentElement.dataset.theme = host.theme ?? 'light'; }
async function call(name, args) {
  const result = await host.callTool(name, args);
  if (result.isError) throw new Error((result.structuredContent?.code ?? 'tool_error') + '：' + (result.structuredContent?.error ?? result.content?.[0]?.text ?? '读取失败'));
  if (!result.structuredContent) throw new Error('工具响应缺少数据');
  return result.structuredContent;
}
document.getElementById('open-form').addEventListener('submit', async event => {
  event.preventDefault(); if (read.disabled) return;
  path.disabled = true; read.disabled = true; status.className = ''; status.textContent = '正在读取…';
  source.hidden = true; source.textContent = ''; text.textContent = '';
  try {
    const data = await call('read_editor_text', { path: path.value });
    source.textContent = data.sourcePath + ' · UTF-8' + (data.encoding.bom ? ' BOM' : '') + ' · ' + data.encoding.newline;
    source.hidden = false; text.textContent = data.text;
    status.textContent = '已读取磁盘正文 · 只读';
  } catch (error) { status.className = 'error'; status.textContent = error.message; }
  finally { path.disabled = false; read.disabled = false; }
});
try {
  if (!host) throw new Error('当前页面没有原生 ZCode 桥接');
  host.subscribe(theme); await host.ready(); theme();
  const bound = await call('get_editor_context', {});
  context.textContent = bound.workspacePath + ' · 当前会话 ' + bound.sessionId;
  path.disabled = false; read.disabled = false; status.textContent = '已确认宿主归属';
} catch (error) {
  context.textContent = '宿主归属未确认，已阻止文件访问';
  status.className = 'error'; status.textContent = error.message;
}
</script>
</body>
</html>
